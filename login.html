<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizAI - Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow rounded-md p-3 w-44">

        <h1 class="text-lg font-bold text-center text-blue-700">
            BizAI
        </h1>

        <p class="text-center text-gray-500 text-[10px] mb-2">
            Welcome Back
        </p>

        <form>

            <label class="block text-[10px] font-semibold mb-1">
                Email
            </label>

            <input
                type="email"
                placeholder="Email"
                class="w-full border rounded px-2 py-1 text-[10px] mb-2 focus:outline-none">

            <label class="block text-[10px] font-semibold mb-1">
                Password
            </label>

            <input
                type="password"
                placeholder="Password"
                class="w-full border rounded px-2 py-1 text-[10px] mb-3 focus:outline-none">

            <button
                type="submit"
                class="w-full bg-blue-600 text-white text-[10px] py-1 rounded hover:bg-blue-700">
                Login
            </button>

        </form>

        <p class="text-center mt-2">
            <a href="#" class="text-[9px] text-blue-600 hover:underline">
                Forgot Password?
            </a>
        </p>

    </div>

</body>
</html>
